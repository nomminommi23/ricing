# UI Colors (extended)
accent = "#1793d1"
cursor = "#c0caf5"

# Primary colors
foreground = "#c0caf5"
background = "#1a1b26"

# Selection colors
selection_foreground = "#1a1b26"
selection_background = "#c0caf5"

# Normal colors (ANSI 0-7)
color0 = "#1a1b26"
color1 = "#f7768e"
color2 = "#a6e3a1"
color3 = "#f9e2af"
color4 = "#1793d1"
color5 = "#cba6f7"
color6 = "#89dceb"
color7 = "#c0caf5"

# Bright colors (ANSI 8-15)
color8 = "#565f89"
color9 = "#f7768e"
color10 = "#a6e3a1"
color11 = "#f9e2af"
color12 = "#7aa2f7"
color13 = "#cba6f7"
color14 = "#89dceb"
color15 = "#ffffff"

# Bar/pill/popup background colors (the terminal's is "background" above, already shared
# with mako) - each paired with the matching *_opacity float below for its transparency
bar_color = "#12131b"
pill_color = "#1a1b26"
popup_color = "#1a1b26"

# GTK file-selection highlight (Thunar's grid, etc.) - decoupled from `accent` so it can
# be set independently, defaults to matching it.
gtk_selection_color = "#f7768e"

# Opacity (0-1) for the bar itself, its pills, its popups, the terminal background, and
# the GTK file-selection highlight above
bar_opacity = 0.18
pill_opacity = 0.85
popup_opacity = 0.9
terminal_opacity = 0.85
gtk_selection_opacity = 0.5
