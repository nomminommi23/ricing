# Generated by theme/render.py from the active palette.
# Edit the template at ~/.config/theme/templates/qt6ct/aether-rice.conf, not the output.
#
# This is a serialized QPalette (Qt::ColorRole order - see qpalette.h), one entry per role,
# read by every Qt6 app via QT_QPA_PLATFORMTHEME=qt6ct (set in hyprland.lua). It's what
# *actually* colors Dolphin - kdeglobals' [Colors:*] sections (theme/templates/kde/) matter
# for KDE/Plasma integration, but qt6ct overrides them for plain Qt widget rendering.
# A few roles (Light/Midlight/Dark/Mid/Shadow/AlternateBase/NoRole/ToolTipBase/
# HighlightedText) don't correspond to anything in colors.toml and are left as the static
# shades already used consistently elsewhere (kdeglobals' unmapped BackgroundAlternate
# values are these same two colors, #20212c and #0f111a).
[ColorScheme]
active_colors=#ff{foreground.strip}, #ff{background.strip}, #ff333446, #ff282a38, #ff101018, #ff1f2029, #ff{foreground.strip}, #ff{color15.strip}, #ff{foreground.strip}, #ff{background.strip}, #ff{background.strip}, #ff000000, #ff{accent.strip}, #ff0f111a, #ff{color12.strip}, #ff{color5.strip}, #ff20212c, #ffffffff, #ff0f111a, #ff{foreground.strip}, #80{color8.strip}
disabled_colors=#ff{color8.strip}, #ff{background.strip}, #ff333446, #ff282a38, #ff101018, #ff1f2029, #ff{color8.strip}, #ff{color15.strip}, #ff{color8.strip}, #ff{background.strip}, #ff{background.strip}, #ff000000, #ff{accent.strip}, #ff{color8.strip}, #ff{color12.strip}, #ff{color5.strip}, #ff20212c, #ffffffff, #ff0f111a, #ff{foreground.strip}, #80{color8.strip}
inactive_colors=#ff{foreground.strip}, #ff{background.strip}, #ff333446, #ff282a38, #ff101018, #ff1f2029, #ff{foreground.strip}, #ff{color15.strip}, #ff{foreground.strip}, #ff{background.strip}, #ff{background.strip}, #ff000000, #ff{accent.strip}, #ff0f111a, #ff{color12.strip}, #ff{color5.strip}, #ff20212c, #ffffffff, #ff0f111a, #ff{foreground.strip}, #80{color8.strip}
