# Generated by aether from the active palette.
# Edit the template at ~/.config/aether/custom/hyprland/theme.conf, not the output.

$activeBorderColor1 = rgba({color4.strip}ff)
$activeBorderColor2 = rgba({color12.strip}ff)
$inactiveBorderColor = rgba({color8.strip}cc)

general {
    col.active_border = $activeBorderColor1 $activeBorderColor2 45deg
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor1 $activeBorderColor2 45deg
}
