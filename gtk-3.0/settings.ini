[Settings]
# Static, not palette-templated - gsettings alone doesn't reach the GTK3 *widget theme*
# here because no XSETTINGS daemon (xsettingsd/gnome-settings-daemon/xfsettingsd) runs
# under Hyprland, so GtkSettings never picks up the dconf value hyprland.lua's
# config.reloaded hook sets for gtk-theme. This file is the direct, daemon-independent
# way to force it; gtk.css (see theme/templates/gtk3/) layers the actual palette colors
# on top of it. The *icon* theme is different: GTK resolves that straight from gsettings
# regardless of any XSETTINGS daemon, so it's set via `gsettings set ... icon-theme` in
# hyprland.lua instead - listing it here too would just be redundant, not more reliable.
gtk-theme-name=Materia-dark
gtk-application-prefer-dark-theme=1
gtk-cursor-theme-name=ArchLogo
gtk-cursor-theme-size=24
