# Generated by theme/render.py from the active palette.
# Edit the template at ~/.config/theme/templates/hyprlock/hyprlock.conf, not the output.
#
# hyprlock's config language only reliably parses its hex color forms here -
# rgb(RRGGBB)/rgba(RRGGBBAA), no commas, alpha as a hex byte appended - not the CSS
# decimal rgba(r, g, b, a) form render.py's .rgba placeholder produces for every other
# app. Hence .hexa below instead of .rgba.
#
# Animations stay disabled: on this GPU/driver, hyprlock's fade-in timer touches a
# screencopy resource that fails to set up at startup regardless of what background is
# actually configured, crashing it right after "Starting fade in" - disabling the
# animation is what stops that, not just avoiding a live screenshot background.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = false
}

background {
    monitor =
    path = /home/nico/.config/hypr/lockscreen-wallpaper.jpg
    color = rgb(1a1b26)
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(1a1b268c)
    outer_color = rgba(1793d1ff)
    check_color = rgba(1793d1ff)
    fail_color = rgba(f7768eff)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Password
    fail_text = Wrong password
    dots_spacing = 0.3
    position = 0, -150
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = cmd[update:3600000] whoami
    font_size = 16
    font_family = $font
    color = rgba(1793d1ff)
    position = 0, -90
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgba(c0caf5ff)
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    color = rgba(c0caf5ff)
    position = 0, 10
    halign = center
    valign = center
}
