# ==========================================================
# Custom Arch / Hyprland Config
# Style: Arch + Productivity + Anime/Gaming balance
# Target: Hyprland 0.55.2+
# Caps Lock normal, no Omarchy source structure
# ==========================================================

# ----------------------------------------------------------
# Monitors
# ----------------------------------------------------------

monitorv2 {
    output = desc:HKC OVERSEAS LIMITED 27E6QC 0000000000001
    mode = 2560x1440@144.00
    position = 0x0
    scale = 1
    sdr_min_luminance = 0.2
    sdr_max_luminance = 80
}

monitorv2 {
    output = desc:LG Electronics L226W  0x00013D4D
    mode = 1680x1050@59.88
    position = 2560x0
    scale = 1
    sdr_min_luminance = 0.2
    sdr_max_luminance = 80
}

# ----------------------------------------------------------
# Environment
# ----------------------------------------------------------

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# NVIDIA
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# ----------------------------------------------------------
# Apps
# ----------------------------------------------------------

$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -theme ~/.config/rofi/arch-blue.rasi
$browser = zen-browser
$mainMod = SUPER

# ----------------------------------------------------------
# Autostart
# ----------------------------------------------------------

exec-once = quickshell -c default
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = swaybg -i ~/.config/hypr/wallpaper.png -m fill
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ----------------------------------------------------------
# Input
# ----------------------------------------------------------

input {
    kb_layout = de

    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

# ----------------------------------------------------------
# Look and Feel
# ----------------------------------------------------------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# Border-Farben von aether (wird bei jedem Theme-Wechsel neu generiert)
source = ~/.config/hypr/aether-theme.conf

decoration {
    rounding = 8

    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = yes
        render_power = 3
        range = 16
        color = rgba(00000052)
    }

    blur {
        enabled = true
        size = 10
        passes = 2
        vibrancy = 0.15
    }
}

animations {
    enabled = yes

    bezier = clean, 0.05, 0.9, 0.1, 1.0
    bezier = fast, 0.15, 1.0, 0.3, 1.0

    animation = windows, 1, 5, clean
    animation = windowsOut, 1, 4, fast, popin 80%
    animation = border, 1, 5, clean
    animation = fade, 1, 4, clean
    animation = workspaces, 1, 5, clean
}

dwindle {
    preserve_split = yes
    smart_split = false
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 1
}
exec = gsettings set org.gnome.desktop.interface gtk-theme "Materia-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps

# ----------------------------------------------------------
# Workspaces
# ----------------------------------------------------------

workspace = 1, monitor:desc:HKC OVERSEAS LIMITED 27E6QC 0000000000001, default:true, persistent:true
workspace = 2, monitor:desc:HKC OVERSEAS LIMITED 27E6QC 0000000000001
workspace = 3, monitor:desc:HKC OVERSEAS LIMITED 27E6QC 0000000000001
workspace = 4, monitor:desc:HKC OVERSEAS LIMITED 27E6QC 0000000000001

workspace = 5, monitor:desc:LG Electronics L226W  0x00013D4D, default:true, persistent:true
workspace = 6, monitor:desc:LG Electronics L226W  0x00013D4D
workspace = 7, monitor:desc:LG Electronics L226W  0x00013D4D
workspace = 8, monitor:desc:LG Electronics L226W  0x00013D4D

workspace = 9, monitor:desc:HKC OVERSEAS LIMITED 27E6QC 0000000000001

# ----------------------------------------------------------
# Keybinds: Apps
# ----------------------------------------------------------

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, N, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod SHIFT, P, exec, spotify
bind = $mainMod SHIFT, C, exec, discord
bind = $mainMod SHIFT, S, exec, steam
bind = $mainMod SHIFT, T, exec, $terminal -e btop
bind = $mainMod SHIFT, A, exec, quickshell -c default ipc call windowswitcher toggle

# ----------------------------------------------------------
# Keybinds: Window control
# ----------------------------------------------------------

bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

binde = $mainMod CTRL, H, resizeactive, -30 0
binde = $mainMod CTRL, L, resizeactive, 30 0
binde = $mainMod CTRL, K, resizeactive, 0 -30
binde = $mainMod CTRL, J, resizeactive, 0 30

# ----------------------------------------------------------
# Workspace binds
# ----------------------------------------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ----------------------------------------------------------
# Mouse binds
# ----------------------------------------------------------

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ----------------------------------------------------------
# Screenshots / clipboard
# ----------------------------------------------------------

bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png
bind = $mainMod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# ----------------------------------------------------------
# Audio / brightness / media
# ----------------------------------------------------------

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ----------------------------------------------------------
# Window rules - new Hyprland 0.55 syntax
# ----------------------------------------------------------

# Terminal touchpad scroll
windowrule = match:class ^(Alacritty|kitty|foot)$, scroll_touchpad 1.5
windowrule = match:class ^(com.mitchellh.ghostty)$, scroll_touchpad 0.2

# Gaming / anime / media
windowrule = match:class ^(steam)$, workspace 7
windowrule = match:class ^(discord)$, workspace 5
windowrule = match:class ^(vesktop)$, workspace 5
windowrule = match:class ^(Spotify)$, workspace 6
windowrule = match:title ^(.*YouTube.*)$, workspace 6
windowrule = match:title ^(zen*)$, workspace 1

# Floating helpers
windowrule = match:class ^(pavucontrol)$, float on, size 900 600, center on
windowrule = match:class ^(blueman-manager)$, float on, center on
windowrule = match:class ^(nm-connection-editor)$, float on, center on

# Games
windowrule = match:class ^(steam_app_.*)$, fullscreen on

# Dialogs
windowrule = match:title ^(Open File)$, float on, center on
windowrule = match:title ^(Save File)$, float on, center on

bind = $mainMod ALT, C, exec, env GTK_THEME=Adwaita XDG_CONFIG_HOME=~/.config qalculate-gtk
