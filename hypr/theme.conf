# Generated by theme/render.py from the active palette.
# Edit the template at ~/.config/theme/templates/hyprland/theme.conf, not the output.

$activeBorderColor1 = rgba(f7768eff)
$activeBorderColor2 = rgba(f7768eff)
$inactiveBorderColor = rgba(565f89cc)

general {
    col.active_border = $activeBorderColor1 $activeBorderColor2 45deg
    col.inactive_border = $inactiveBorderColor
}

group {
    col.border_active = $activeBorderColor1 $activeBorderColor2 45deg
}
