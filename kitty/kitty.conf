# Farben aus theme/colors.toml (wird bei jedem Theme-Wechsel neu generiert, siehe theme/render.py)
include ~/.config/kitty/theme.conf

# Transparenz
background_opacity 0.85

# Cursor
cursor #7aa2f7

# Keine Terminal-Glocke
enable_audio_bell no

# Schrift
font_family JetBrainsMono Nerd Font
font_size 11
